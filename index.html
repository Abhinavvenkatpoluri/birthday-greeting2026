
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fce8f0">

  <!-- PRIVATE SOCIAL MEDIA PREVIEW -->
  <title>A Little Surprise </title>

  <meta name="description"
        content="Something special is waiting for you. Open when you're ready.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="A Little Surprise ">
  <meta property="og:description"
        content="Something special is waiting for you. Open when you're ready.">
  <meta property="og:url"
        content="https://birthday-greeting2026.vercel.app/">
  <meta property="og:image"
        content="https://birthday-greeting2026.vercel.app/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="A Little Surprise ">
  <meta name="twitter:description"
        content="Something special is waiting for you.">

  <style>
    :root {
      color-scheme: light;
      --pink: #f9dce8;
      --surface: rgba(255,255,255,.78);
      --shadow: 0 18px 55px rgba(174,105,143,.16);
      --page-gutter: clamp(12px, 3vw, 30px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      scroll-behavior: smooth;
      background: #fcecf2;
    }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: clip;
      color: #593d50;
      background:
        radial-gradient(ellipse at 12% 18%, #fff9, transparent 35%),
        radial-gradient(ellipse at 90% 80%, #e8d8f6d9, transparent 38%),
        linear-gradient(135deg, #fce8f0, #fff5f6 48%, #f1eafa);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    /* SNOWFALL */

    #snow {
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
      contain: strict;
    }

    .flake {
      position: absolute;
      top: -18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px #fff;
      animation: fall linear infinite;
      will-change: transform;
    }

    @keyframes fall {
      0% {
        transform: translate3d(0,-5vh,0);
        opacity: 0;
      }

      12%, 88% {
        opacity: .8;
      }

      100% {
        transform: translate3d(35px,110vh,0);
        opacity: 0;
      }
    }

    /* MAIN */

    main {
      width: min(100%, 1180px);
      margin-inline: auto;
      padding: clamp(14px, 4vw, 48px) var(--page-gutter) 64px;
    }

    /* VIDEO */

    .video-wrap {
      padding: clamp(5px, 1vw, 10px);
      border: 1px solid #ffffffd9;
      border-radius: clamp(15px, 2.2vw, 26px);
      background: linear-gradient(
        135deg,
        #fff,
        #f2c9da,
        #e7dcf3
      );
      box-shadow: var(--shadow);
    }

    video {
      display: block;
      width: 100%;
      height: min(76svh, 720px);
      min-height: 220px;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #2d2028;
      border-radius: clamp(10px, 1.5vw, 18px);
    }

    /* PLAY WITH SOUND BUTTON */

    .play-btn {
      display: block;
      margin: 18px auto 12px;
      padding: 15px 32px;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 50px;

      background: linear-gradient(
        135deg,
        #f78bb6,
        #d94c89
      );

      color: white;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: .3px;
      cursor: pointer;

      box-shadow: 0 8px 25px rgba(217,76,137,.25);

      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    .play-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 30px rgba(217,76,137,.4);
    }

    .play-btn:active {
      transform: scale(.96);
    }

    .play-btn:focus-visible {
      outline: 3px solid #a72d66;
      outline-offset: 4px;
    }

    .play-hint {
      margin: 0 0 12px;
      text-align: center;
      color: #95647b;
      font-size: 12px;
    }

    /* GALLERY */

    .gallery {
      margin-top: clamp(42px, 8vw, 92px);
      width: 100%;
      overflow: hidden;

      -webkit-mask-image: linear-gradient(
        to right,
        transparent,
        #000 3%,
        #000 97%,
        transparent
      );

      mask-image: linear-gradient(
        to right,
        transparent,
        #000 3%,
        #000 97%,
        transparent
      );
    }

    .rail {
      display: flex;
      width: max-content;
      gap: clamp(12px, 2.2vw, 25px);
      padding: 18px 8px 30px;

      animation: photo-scroll 72s linear infinite;
      will-change: transform;
    }

    .gallery:hover .rail,
    .gallery:focus-within .rail {
      animation-play-state: paused;
    }

    .gallery:active .rail {
      animation-play-state: paused;
    }

    .photo-group {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: clamp(12px, 2.2vw, 25px);
    }

    @keyframes photo-scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    /* PHOTO CARDS */

    .photo {
      flex: 0 0 clamp(210px, 28vw, 330px);
      height: clamp(250px, 36vw, 400px);
      margin: 0;
      padding: 8px 8px 12px;
      border: 1px solid #ffffffed;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 12px 35px rgba(172,104,137,.16);
      transform: rotate(var(--tilt, 0deg));

      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    .photo:hover {
      z-index: 1;
      transform: translateY(-7px) rotate(0);
      box-shadow: 0 20px 45px rgba(172,104,137,.24);
    }

    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 3px;
      object-fit: cover;
      background: #f5e8ee;
    }

    /* MOBILE RESPONSIVE */

    @media (max-width: 600px) {
      main {
        padding: 12px 10px 42px;
      }

      video {
        height: auto;
        min-height: 0;
        max-height: 72svh;
        aspect-ratio: 9 / 16;
      }

      .photo {
        flex-basis: 78vw;
        height: min(92vw, 430px);
      }

      .gallery {
        margin-top: 42px;
      }

      .play-btn {
        width: min(100%, 290px);
      }
    }

    @media (max-width: 380px) {
      .photo {
        flex-basis: 84vw;
        height: 100vw;
      }
    }

    /* REDUCED MOTION */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }

      .gallery {
        overflow-x: auto;
        mask-image: none;
        -webkit-mask-image: none;
      }

      .rail {
        transform: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- SNOW -->

  <div id="snow" aria-hidden="true"></div>

  <main>

    <!-- BIRTHDAY VIDEO -->

    <section class="video-wrap" aria-label="Birthday video">

      <video
        id="birthdayVideo"
        playsinline
        controls
        preload="metadata">

        <source
          src="video_project.mp4"
          type="video/mp4">

        Sorry, your browser does not support embedded videos.

      </video>

      <!-- PLAY WITH SOUND BUTTON -->

    

      <p class="play-hint" id="playHint">
        A little surprise is waiting for you ✨
      </p>

    </section>

    <!-- PHOTO GALLERY -->

    <section
      class="gallery"
      id="gallery"
      aria-label="Photo memories">

      <div class="rail" id="photoRail">

        <div class="photo-group" id="photoGroup">

          <figure class="photo" style="--tilt:-1.5deg">
            <img src="assets/File_000.png" alt="Memory photo 1" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:1.2deg">
            <img src="assets/File_001.png" alt="Memory photo 2" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:-0.8deg">
            <img src="assets/File_002.png" alt="Memory photo 3" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:1.6deg">
            <img src="assets/File_003.png" alt="Memory photo 4" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:-1.2deg">
            <img src="assets/File_004.png" alt="Memory photo 5" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:0.8deg">
            <img src="assets/File_005.png" alt="Memory photo 6" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:-1.5deg">
            <img src="assets/File_006.png" alt="Memory photo 7" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:1.2deg">
            <img src="assets/File_007.png" alt="Memory photo 8" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:-0.8deg">
            <img src="assets/File_008.png" alt="Memory photo 9" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:1.6deg">
            <img src="assets/File_009.png" alt="Memory photo 10" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:-1.2deg">
            <img src="assets/File_010.png" alt="Memory photo 11" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:0.8deg">
            <img src="assets/File_011.png" alt="Memory photo 12" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:-1.5deg">
            <img src="assets/File_012.png" alt="Memory photo 13" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:1.2deg">
            <img src="assets/File_013.png" alt="Memory photo 14" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:-0.8deg">
            <img src="assets/File_014.png" alt="Memory photo 15" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:1.6deg">
            <img src="assets/File_015.png" alt="Memory photo 16" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:-1.2deg">
            <img src="assets/File_016.png" alt="Memory photo 17" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:0.8deg">
            <img src="assets/File_017.png" alt="Memory photo 18" loading="lazy" decoding="async">
          </figure>

          <figure class="photo" style="--tilt:-1.5deg">
            <img src="assets/File_018.png" alt="Memory photo 19" loading="lazy" decoding="async">
          </figure>

        </div>

        <!-- DUPLICATE GROUP GENERATED AUTOMATICALLY -->

      </div>
    </section>

  </main>

  <script>
    (() => {

      const snow = document.getElementById('snow');
      const video = document.getElementById('birthdayVideo');
      const playBtn = document.getElementById('playBtn');
      const playHint = document.getElementById('playHint');
      const gallery = document.getElementById('gallery');
      const rail = document.getElementById('photoRail');
      const group = document.getElementById('photoGroup');

      const reduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      /* INFINITE PHOTO GALLERY */

      const clone = group.cloneNode(true);

      clone.removeAttribute('id');
      clone.setAttribute('aria-hidden', 'true');

      clone.querySelectorAll('img').forEach((img) => {
        img.alt = '';
        img.loading = 'lazy';
      });

      rail.appendChild(clone);

      /* GENERATE SNOWFALL */

      if (!reduceMotion) {

        const fragment = document.createDocumentFragment();

        const count = window.matchMedia(
          '(max-width: 600px)'
        ).matches ? 28 : 55;

        for (let i = 0; i < count; i++) {

          const flake = document.createElement('i');
          const size = 2 + Math.random() * 4;

          flake.className = 'flake';
          flake.style.left = `${Math.random() * 100}%`;
          flake.style.width = `${size}px`;
          flake.style.height = `${size}px`;

          flake.style.opacity =
            (0.35 + Math.random() * 0.55).toFixed(2);

          flake.style.animationDuration =
            `${8 + Math.random() * 13}s`;

          flake.style.animationDelay =
            `${-Math.random() * 20}s`;

          fragment.appendChild(flake);
        }

        snow.appendChild(fragment);
      }

      /* PLAY VIDEO WITH SOUND */

      playBtn.addEventListener('click', async () => {

        video.muted = false;
        video.volume = 1;

        try {

          await video.play();

          playBtn.style.display = 'none';
          playHint.style.display = 'none';

        } catch (error) {

          console.error('Video playback failed:', error);

          playHint.textContent =
            'Please use the video play controls to try again ❤️';
        }

      });

      /* SCROLL TO GALLERY AFTER VIDEO */

      video.addEventListener('ended', () => {

        gallery.scrollIntoView({
          behavior: reduceMotion ? 'auto' : 'smooth',
          block: 'center'
        });

      });

    })();
  </script>

</body>
</html>
